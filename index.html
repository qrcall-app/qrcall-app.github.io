<!doctype html>
<!--
  사이트 루트 안내 페이지 — 방문자는 안내판의 QR(…/guest.html#g1.<방 키>)로만 들어온다.
  주소를 직접 친 사람에게 GitHub Pages 의 404 대신 짧은 안내만 보인다. 기능은 없다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>QR콜</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0c1413; color: #e6f2f0;
         min-height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; font-weight: 700; color: #7adfd2; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 16px; gap: 14px; text-align: center; }
  p { margin: 0; max-width: 32rem; line-height: 1.6; }
  .note { color: #9fb4b0; font-size: 14px; }
</style>
</head>
<body>
<header>QR콜</header>
<main>
  <p>이 주소는 직접 열어 쓰는 페이지가 아닙니다.</p>
  <p class="note">안내판의 QR 코드를 휴대폰 카메라로 찍으면 앱 설치 없이 통화 페이지가 열립니다.<br>
  QR 없이 열린 통화 페이지는 연결할 상대가 없어 동작하지 않습니다.</p>
</main>
</body>
</html>
